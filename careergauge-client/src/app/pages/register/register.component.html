<div class="register-page">
  <div class="register-card">
    <h1>CareerGauge</h1>

    <p class="subtitle">
      Create your account
    </p>

    <form (ngSubmit)="register()">

      <div class="form-group">
        <label for="name">
          Full name
        </label>

        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="name"
          required
          placeholder="Enter your name"
        />
      </div>

      <div class="form-group">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          placeholder="Create a password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          Confirm password
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Confirm your password"
        />
      </div>

      @if (errorMessage) {
        <p class="error">
          {{ errorMessage }}
        </p>
      }

      @if (successMessage) {
        <p class="success">
          {{ successMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="
          isLoading ||
          !name ||
          !email ||
          !password ||
          !confirmPassword
        ">
        {{ isLoading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">
        Sign in
      </a>
    </p>
  </div>
</div>
