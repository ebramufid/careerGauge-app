<div class="login-page">
  <div class="login-card">
    <h1>CareerGauge</h1>

    <p class="subtitle">
      Sign in to your account
    </p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          placeholder="Enter your password"
        />
      </div>

      @if (errorMessage) {
        <p class="error">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="isLoading || !email || !password">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">
        Create an account
      </a>
    </p>
  </div>
</div>
